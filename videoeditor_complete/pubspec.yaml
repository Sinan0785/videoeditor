name: video_editor_pro
description: A feature-rich video editor for Android, inspired by CapCut

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  video_player: ^2.8.2
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  photo_manager: ^3.0.0
  just_audio: ^0.9.36
  audio_waveforms: ^1.0.5
  provider: ^6.1.2
  flutter_colorpicker: ^1.0.3
  google_fonts: ^6.2.1
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  share_plus: ^7.2.2
  gallery_saver: ^2.3.2
  cupertino_icons: ^1.0.6
  fluttertoast: ^8.2.4
  uuid: ^4.3.3
  intl: ^0.19.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/stickers/
    - assets/transitions/
    - assets/icons/
